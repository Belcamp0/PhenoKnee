# PhenoKnee — static deployment.
# No build step: the app is a single self-contained HTML file.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # The app loads no third-party code and makes no network calls.
    # This CSP is what enforces that, rather than leaving it to trust.
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
